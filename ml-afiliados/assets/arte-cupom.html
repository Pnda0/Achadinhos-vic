<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&family=Yellowtail&family=Oswald:wght@300;400&family=Inter:wght@600;700&display=swap">
<style>
  :root { --vinho: #7a1712; --vinho-esc: #5e100c; --rosa: #d17b96; --creme: #f9f5ec; --ouro: #f2b85c; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    position: relative;
    background: repeating-linear-gradient(180deg, var(--rosa) 0 135px, var(--vinho) 135px 270px);
    font-family: Inter, sans-serif;
  }
  /* adesivo creme com a palavra em cursiva (como "Achadinhos" na logo) */
  .adesivo {
    position: absolute; left: 50%; top: 120px; transform: translateX(-50%) rotate(-6deg);
    font: 330px/1 Sacramento, cursive; color: var(--vinho);
    -webkit-text-stroke: 2.5px var(--vinho);
    padding: 0 40px;
    text-shadow: 0 0 0 var(--creme);
    filter: drop-shadow(0 10px 14px rgba(40, 0, 0, .35));
    white-space: nowrap;
  }
  .adesivo span { position: relative; z-index: 1; }
  .adesivo::before {
    content: attr(data-t); position: absolute; left: 40px; top: 0; z-index: 0;
    color: var(--creme); -webkit-text-stroke: 40px var(--creme);
  }
  /* prendedor de papel no canto do adesivo */
  .prendedor { position: absolute; right: 70px; top: 150px; width: 150px; height: 120px; transform: rotate(18deg); filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
  .linha-da { position: absolute; left: 0; right: 0; top: 520px; display: flex; justify-content: center; align-items: flex-end; gap: 30px; }
  .da { font: 120px/1 Yellowtail, cursive; color: var(--creme); transform: translateY(-150px); }
  .vic { font: 300 330px/0.85 Oswald, sans-serif; color: var(--ouro); letter-spacing: 4px; text-shadow: 6px 8px 0 rgba(60, 5, 2, .45); }
  .estrela { position: absolute; right: 70px; top: 610px; width: 190px; height: 190px; transform: rotate(12deg); }
  .rodape {
    position: absolute; left: 0; right: 0; bottom: 60px; display: flex; justify-content: center; align-items: center; gap: 26px;
  }
  .foto { width: 150px; height: 150px; border-radius: 50%; border: 9px solid var(--creme); background: url('avatar.jpg') center/cover; box-shadow: 0 8px 18px rgba(40,0,0,.35); }
  .chamada { background: var(--creme); color: var(--vinho); border-radius: 22px; padding: 20px 34px; font: 700 40px/1.15 Inter, sans-serif; box-shadow: 0 8px 18px rgba(40,0,0,.3); }
  .chamada small { display: block; font: 600 26px/1.3 Inter, sans-serif; color: #8a4a44; }
</style>
</head>
<body>
  <svg class="prendedor" viewBox="0 0 150 120" aria-hidden="true">
    <defs><linearGradient id="m" x1="0" x2="1"><stop offset="0" stop-color="#6d6f73"/><stop offset=".45" stop-color="#d7d9dc"/><stop offset="1" stop-color="#77797d"/></linearGradient></defs>
    <rect x="10" y="62" width="130" height="34" rx="7" fill="url(#m)"/>
    <rect x="42" y="18" width="66" height="54" rx="8" fill="url(#m)"/>
    <circle cx="75" cy="32" r="18" fill="#8e9095"/><circle cx="75" cy="32" r="10" fill="#c9cbce"/>
  </svg>
  <div class="adesivo" data-t="__PALAVRA__"><span>__PALAVRA__</span></div>
  <div class="linha-da"><span class="da">da</span><span class="vic">VIC</span></div>
  <svg class="estrela" viewBox="-100 -100 200 200" aria-hidden="true">
    <g fill="#f2b85c" stroke="#f2b85c" stroke-width="3" stroke-linejoin="round">
      <path d="M0,-96 L9,-14 L68,-68 L16,-4 L96,6 L14,12 L58,74 L4,18 L-8,92 L-10,16 L-66,62 L-18,4 L-94,-10 L-16,-10 L-62,-70 L-4,-16 Z"/>
    </g>
  </svg>
  <div class="rodape">
    <div class="foto"></div>
    <div class="chamada">__CHAMADA__<small>__SUB__</small></div>
  </div>
</body>
</html>
